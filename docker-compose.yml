# ==============================================================================
# HireSense — Master Docker Compose Orchestration (Production / Local Staging)
# ==============================================================================

version: '3.8'

services:
  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hiresense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hiresense_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-HireSenseSecretPass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-hiresense_prod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiresense_user -d hiresense_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache & Task Queue ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hiresense-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend API ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hiresense-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hiresense_user}:${POSTGRES_PASSWORD:-HireSenseSecretPass2026!}@postgres:5432/${POSTGRES_DB:-hiresense_prod}
      JWT_SECRET: ${JWT_SECRET:-HireSenseProductionMasterSecret2026!ChangeMe}
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://localhost:5173", "http://localhost:5174", "http://127.0.0.1"]'
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── React Vite Frontend (Nginx) ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hiresense-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "3000:80"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
